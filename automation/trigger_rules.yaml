# trigger_rules.yaml — 낙폭 트리거 임계 룰 (Task M)
#
# 손으로 관리하는 파일. calibration.yaml(recalibrate.py가 자동 재생성)과 달리 덮어써지지 않는다.
# 근거 산출: automation/src/tools/dd_calibration.py  (재실행해서 아래 evidence 갱신)
#
# 설계 원칙: 구조(structure)마다 하방 캡처율이 달라서, 같은 임계를 써도 실제 알림 빈도와
# "언더라잉이 얼마나 빠졌을 때 울리는지"가 달라진다. 트래커의 알림 부담(연 5~11회)을
# 기준선으로 잡고 구조별로 맞춘다.

meta:
  updated: "2026-08-15"
  tool: "automation/src/tools/dd_calibration.py"
  basis: "전월말 종가 대비 / 월 단위 de-dup / auto_adjust=True(분배금 재투자, yf history 기본값)"
  caveat: >-
    커버드콜 표본은 2~4년으로 전부 상승장이다. 하락장 NAV 침식은 미검증이며 상승캡처 우위도
    국면 산물일 수 있다. QLD 깊은 낙폭 표본은 20년간 5건으로 통계적으로 약하다.
    첫 가이드라인일 뿐이며 라이브 데이터가 쌓이면 재보정한다.

# ── 구조별 낙폭 임계 (전월말 종가 대비, 음수) ──────────────────────────
thresholds:
  tracker:      [-0.03, -0.05, -0.07, -0.10]
  dividend:     [-0.03, -0.05, -0.07, -0.10]
  # 커버드콜: 트래커와 동일 임계를 그대로 쓴다.
  #   하락캡처가 0.68~0.81x라 같은 임계면 알림이 트래커의 69~90% 빈도로만 울리고,
  #   울릴 때는 언더라잉이 1.3배 더 깊이 빠진 상황 → 동일 임계 자체가 중복 제거 필터로 작동.
  #   임의 상수를 새로 만들 근거가 없어 트래커와 통일.
  covered_call: [-0.03, -0.05, -0.07, -0.10]
  # 레버리지: 하락캡처 2.12x. 트래커 임계를 쓰면 연 15.7회로 거의 매달 울린다.
  #   캡처 환산(-6.4/-10.6/-14.8/-21.2)과 빈도 정합(-7/-12/-16/-21)이 독립적으로 일치.
  leveraged:    [-0.07, -0.12, -0.16, -0.21]

# 메시지 헤더 "⚠️ {종류} · {대상}"의 대상 라벨
scope_label:
  tracker: "지수"
  dividend: "지수"
  covered_call: "커버드콜"
  leveraged: "레버리지"

# ── QLD 라운드트립 경보 (ATH·진입가 기준 — 낙폭 경보와 성격이 다른 별도 트리거) ──
# 규칙 자체는 todo.md K.6에서 확정, index_daily.qld_signal이 상태를 관리한다.
# 트리거는 state를 읽기만 하고 쓰지 않는다(07:00 index_daily와 쓰기 충돌 방지).
qld_roundtrip:
  enabled: true
  instrument: "QLD"
  stop_loss_pct: -0.18                  # 진입가 대비 손절선
  state_path: "indices/QLD/state.yaml"  # 읽기 전용
  # ATH 기준 진입권 알림(-35/-40/-45)은 제거했다.
  #   근거: 그 자리에서 매수 시 12개월 후 중앙 -1.8%, 승률 50%(-35%만 보면 -26%/33%).
  #   아무 날이나 매수(+37.1%/81%)보다 크게 나쁘다. 진입 후 중앙 -34% 추가 하락.
  #   극단 낙폭은 "싸진 것"이 아니라 "추세가 꺾인 것"이라 매수 신호로 쓸 수 없다.
  #   손절만 남긴다 — 실패 시 평균 -39%라 자본보존 장치는 필요하다.

# ── 청산 알림 ────────────────────────────────────────────────────
# 전략: 알림에 고정금액 매수 → baseline(진입 당시 전월말 종가) 복귀 시 전량 청산.
# 진입 시점의 baseline을 보존해야 한다(달이 바뀌면 baseline이 달라지므로).
exit_alert:
  enabled: true

# ── 심화 확률 (Task M.7) ────────────────────────────────────────
# "지금 살까, 더 기다릴까" 판단용. 알림 시점부터 baseline 복귀 전까지
# 더 깊은 지점에 도달한 비율. 구간 중간지점(-9.5/-14/-18.5)을 포함한다.
# 산출: dd_calibration.py deepen
deepening:
  QLD:
    "-0.07":
      n: 70
      recover_immediately: 0.03        # 추가 하락 없이 바로 회복한 비율
      probs: {"-0.095": 0.81, "-0.12": 0.73, "-0.14": 0.54,
              "-0.16": 0.47, "-0.185": 0.41, "-0.21": 0.30}
      # 조건 충족 시 '다음 중간지점(-9.5%)' 도달 확률. 미충족 시 값도 같이 둔다.
      conditions:
        - {key: near_ath, label: "ATH 대비 -20% 이내", p_yes: 0.89, p_no: 0.76, n_yes: 28}
        - {key: vix_low,  label: "VIX < 25",          p_yes: 0.88, p_no: 0.71, n_yes: 41}
        - {key: above_ma200, label: "MA200 위",        p_yes: 0.88, p_no: 0.75, n_yes: 33}
      advice: {wait_to: -0.12, immediate_annual: 0.30, wait_annual: 0.47}
    "-0.12":
      n: 47
      recover_immediately: 0.09
      probs: {"-0.14": 0.77, "-0.16": 0.64, "-0.185": 0.55, "-0.21": 0.49}
      # 이 단계에선 방향이 뒤집힌다 — '베어장 확인'이 심화 신호다.
      conditions:
        - {key: below_ma200, label: "MA200 아래", p_yes: 0.83, p_no: 0.65, n_yes: 29}
        - {key: vol_high,    label: "변동성 높음", p_yes: 0.83, p_no: 0.65, n_yes: 29}
      advice: {wait_to: -0.16, immediate_annual: 0.30, wait_annual: 0.39}
    "-0.16":
      n: 24
      recover_immediately: 0.04
      probs: {"-0.185": 0.88, "-0.21": 0.71}
      conditions: []
      advice: {wait_to: -0.21, immediate_annual: 0.22, wait_annual: 0.28}

# ── 근거 (dd_calibration.py 산출값) ─────────────────────────────────
evidence:
  downside_capture:      # 언더라잉이 내린 달의 낙폭 배율
    JEPQ: 0.68
    QQQI: 0.73
    GPIQ: 0.77
    SPYI: 0.72
    GPIX: 0.81
    458760.KS: 0.25      # 환 상쇄 지배(원화 비헤지) — SCHD -12%급이라야 -3% 도달
    0008S0.KS: 0.25
    QLD: 2.12
  upside_capture:        # 전 종목이 하락캡처보다 높다 = 비대칭 유리(표본 한계 있음)
    JEPQ: 0.72
    QQQI: 0.79
    GPIQ: 0.85
    SPYI: 0.75
    GPIX: 0.87
    458760.KS: 0.58
    0008S0.KS: 0.52
  nav_recovery_1y:       # -3% 돌파 후 1년 내 원가격(NAV) baseline 복귀율 — 분배금 착시 배제
    QQQ: 0.89
    SPY: 0.90
    JEPQ: 0.95
    QQQI: 0.92
    GPIQ: 0.92
    SPYI: 1.00
    GPIX: 1.00
  alerts_per_year:       # 실제 텔레그램 메시지 수(레벨 순차 돌파 합산), 최근 3년
    QLD_leveraged_rule: 9.0
    QLD_tracker_rule: 15.7
    QQQ: 11.0
    SPY: 6.7
    SCHD: 4.7
  roundtrip:             # 알림에 고정금액 매수 → baseline 복귀 청산. 미회복 건 포함 정직한 손익.
    QLD:                 # 회복률 / 기대수익 / 실패시 손익 / 평균보유일 / 연환산
      "-0.07": {recover: 0.91, ev: 0.049, fail: -0.390, days: 54, annual: 0.25}
      "-0.12": {recover: 0.84, ev: 0.061, fail: -0.406, days: 74, annual: 0.22}
      "-0.16": {recover: 0.74, ev: 0.042, fail: -0.442, days: 103, annual: 0.11}
      "-0.21": {recover: 0.60, ev: 0.068, fail: -0.298, days: 132, annual: 0.13}
    tracker:             # 트래커는 연 3~10% — buy&hold(SPY 연 10.9%)보다 못하다.
      "-0.03": {recover: 0.92, ev: 0.019, fail: -0.199, days: 50, annual: 0.10}
      "-0.05": {recover: 0.84, ev: 0.010, fail: -0.261, days: 74, annual: 0.03}
      "-0.07": {recover: 0.79, ev: 0.018, fail: -0.228, days: 94, annual: 0.05}
      "-0.10": {recover: 0.75, ev: 0.028, fail: -0.288, days: 105, annual: 0.07}
    note: >-
      커버드콜은 77건 전부 회복해 실패 표본이 0건 — 4년 상승장 산물이라 수치를 신뢰할 수 없다.
      알림은 받되 판단은 데이터가 쌓인 뒤로 미룬다.
  wait_vs_immediate:     # QLD, 알림마다 100만원 고정, 20년 총손익
    "-0.07": {immediate: 5286285, wait_mid: 6761808, wait_next: 8281502}
    "-0.12": {immediate: 5285904, wait_mid: 6195097, wait_next: 6773384}
    "-0.16": {immediate: 3167696, wait_mid: 3945930, wait_next: 4211220}
  qld_ath_episodes:      # 20.1년(2006~2026), ATH 회복으로 에피소드 구분
    reach_-20pct: {count: 15, period_years: 1.3, median_recovery_days: 82}
    reach_-30pct: {count: 6, period_years: 3.3, median_recovery_days: 132}
    reach_-35pct: {count: 5, period_years: 4.0, median_recovery_days: 137}
    reach_-45pct: {count: 3, period_years: 6.7, median_recovery_days: 514}
    conditional_deepening:   # 도달 시 추가 5%p 심화 확률
      from_-30pct: 0.83
      from_-35pct: 1.00      # 5건 전부 -40%까지 진행 → -35% 전량 진입은 금물
      from_-45pct: 1.00      # -45%도 바닥이 아니다
