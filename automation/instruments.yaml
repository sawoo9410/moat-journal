# instruments.yaml — 지수/ETF 유니버스 (Task K.1)
#
# 주식 moat 트랙과 분리된 index 레인의 대상 목록.
# 각 항목: id, yf_symbol, structure, tracks, currency, hedged, valuation_source
#
# structure(유형): tracker(지수추종) / dividend(배당) / covered_call(커버드콜) / leveraged(레버리지)
# valuation_source: 밸류(PER) 상속 원천 티커. null=self(자체 산출).
#   가격·낙폭·MA·52주위치·타이밍은 상속 금지 — 반드시 자기 시계열로 계산 (K.2).
# hedged: 낙폭 해석 주석용 (헤지=지수+비용, 비헤지=지수±환).

instruments:
